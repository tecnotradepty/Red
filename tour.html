<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RED Casco | VIP Tour Inmersivo</title>
    
    <!-- Tailwind CSS y FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pannellum (Visor 360) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { redNeon: '#ff003c', darkBg: '#050505' } } }
        }
    </script>
    <style>
        body { margin: 0; background-color: #050505; color: white; overflow: hidden; font-family: sans-serif; }
        
        /* Ocultar elementos por defecto de Pannellum para un look White Label */
        .pnlm-about-msg { display: none !important; }
        .pnlm-load-box { display: none !important; } /* Ocultamos el loader original para usar el nuestro */
        
        /* Efecto de cristal */
        .glass-panel { background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }

        /* Customización de los Hotspots (Flechas tipo Google Maps) */
        .custom-hotspot {
            width: 40px; height: 40px; background: rgba(255, 0, 60, 0.8);
            border-radius: 50%; border: 2px solid white;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
            display: flex; justify-content: center; items-center; cursor: pointer;
            animation: pulse-hotspot 2s infinite;
        }
        .custom-hotspot::after { content: "\f0b2"; font-family: "Font Awesome 5 Free"; font-weight: 900; color: white; line-height: 36px; margin-left: 12px;}
        @keyframes pulse-hotspot { 0% { box-shadow: 0 0 0 0 rgba(255,0,60, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,0,60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,60, 0); } }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- ========================================== -->
    <!-- PANTALLA DE CARGA PSICOLÓGICA              -->
    <!-- ========================================== -->
    <div id="loader" class="fixed inset-0 bg-darkBg z-[100] flex flex-col justify-center items-center transition-opacity duration-1000">
        <!-- Logo Pulsante -->
        <h2 class="text-4xl font-black tracking-[0.3em] mb-12">RED<span class="text-redNeon">.</span></h2>
        
        <!-- Barra de Progreso Simulada -->
        <div class="w-64 h-1 bg-gray-900 rounded-full overflow-hidden mb-6">
            <div id="progress-bar" class="h-full bg-redNeon w-0 transition-all duration-[2000ms] ease-out"></div>
        </div>
        
        <!-- Textos Dinámicos que aportan valor -->
        <p id="loading-text" class="text-[10px] text-gray-500 uppercase tracking-widest h-4">Validando acceso al portal...</p>
    </div>

    <!-- ========================================== -->
    <!-- HEADER CORPORATIVO (20% de altura)         -->
    <!-- ========================================== -->
    <header class="h-[20vh] relative flex flex-col justify-center items-center bg-gradient-to-b from-[#111] to-[#050505]">
        <!-- Botón de regreso -->
        <a href="index.html" class="absolute top-4 left-4 glass-panel px-4 py-2 rounded-sm text-[10px] font-bold uppercase tracking-widest text-white hover:text-redNeon transition flex items-center">
            <i class="fas fa-arrow-left mr-2"></i> Volver
        </a>
        
        <h1 class="text-2xl font-black tracking-[0.2em]">RED<span class="text-redNeon">.</span></h1>
        <p class="text-[9px] text-redNeon uppercase tracking-widest mt-1 border border-redNeon/30 px-2 py-0.5 rounded">Experiencia Inmersiva</p>
    </header>

    <!-- ========================================== -->
    <!-- VISOR 3D (60% de altura, corrige el estirado) -->
    <!-- ========================================== -->
    <main id="panorama" class="h-[60vh] w-full border-y border-white/10 relative shadow-[0_0_50px_rgba(0,0,0,1)_inset]">
        <!-- El 3D se renderiza aquí -->
    </main>

    <!-- ========================================== -->
    <!-- FOOTER INFO & CALL TO ACTION (20% altura)  -->
    <!-- ========================================== -->
    <footer class="h-[20vh] relative flex flex-col justify-center items-center p-4 text-center bg-gradient-to-t from-[#111] to-[#050505]">
        <h2 id="scene-title" class="text-white font-black uppercase text-sm mb-1 tracking-widest">Cargando Zona...</h2>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-4">Toca los puntos rojos en la imagen para navegar</p>
        
        <button class="bg-redNeon text-white px-8 py-3 rounded-sm font-black text-[10px] uppercase tracking-widest shadow-[0_0_15px_rgba(255,0,60,0.3)] hover:bg-white hover:text-black hover:shadow-none transition">
            Reservar esta ubicación
        </button>
    </footer>

    <!-- ========================================== -->
    <!-- LÓGICA DEL ENTORNO Y GOOGLE MAPS STYLE     -->
    <!-- ========================================== -->
    <script>
        // 1. Lógica de la Pantalla de Carga (Psicología UX)
        const loadingTexts = [
            "Validando acceso al portal...",
            "Renderizando entorno 360°...",
            "Enfriando las botellas...",
            "Desbloqueando zonas VIP..."
        ];
        
        let textIndex = 0;
        const textElement = document.getElementById('loading-text');
        const progressBar = document.getElementById('progress-bar');
        
        // Simular progreso de la barra
        setTimeout(() => { progressBar.style.width = '40%'; }, 100);
        setTimeout(() => { progressBar.style.width = '80%'; }, 1000);

        // Cambiar textos cada 800ms
        const textInterval = setInterval(() => {
            textIndex = (textIndex + 1) % loadingTexts.length;
            textElement.innerText = loadingTexts[textIndex];
        }, 800);

        // 2. Configuración del Visor 3D y Sistema de Escenas (Google Maps)
        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "vip",
                "autoLoad": true,
                "autoRotate": -1, // Rotación súper suave
                "compass": false,
                "showZoomCtrl": false,
                "mouseZoom": true
            },
            "scenes": {
                // ESCENA 1: Adentro / VIP (Tu primera foto)
                "vip": {
                    "title": "Zona VIP Platinum",
                    "type": "equirectangular",
                    "panorama": "https://raw.githubusercontent.com/tecnotradepty/Red/5eaa68232f7ea27b929ef879b4d5becc4658e986/imagenes/20260724_173452.jpg",
                    "vaov": 60, // MAGIA: Limita la altura vertical para que no se estire tu foto panorámica
                    "haov": 360,
                    "pitch": 0,
                    "yaw": 0,
                    "hotSpots": [
                        {
                            "pitch": 0, 
                            "yaw": 90, // Posición horizontal del botón (ajústalo si no apunta a la salida)
                            "type": "scene",
                            "text": "Moverse a la Entrada / Caja",
                            "sceneId": "entrada",
                            "cssClass": "custom-hotspot"
                        }
                    ]
                },
                // ESCENA 2: La Puerta (Tu segunda foto)
                "entrada": {
                    "title": "Entrada y Taquilla",
                    "type": "equirectangular",
                    "panorama": "https://raw.githubusercontent.com/tecnotradepty/Red/8dabb90dc58105109fe02a4ea65831cc0b9090ed/imagenes/tour2.jpg",
                    "vaov": 60, // Evita que se estire
                    "haov": 360,
                    "pitch": 0,
                    "yaw": 0,
                    "hotSpots": [
                        {
                            "pitch": 0,
                            "yaw": -30, // Posición apuntando hacia adentro del local
                            "type": "scene",
                            "text": "Entrar a Zona VIP",
                            "sceneId": "vip",
                            "cssClass": "custom-hotspot"
                        }
                    ]
                }
            }
        });

        // 3. Conectar el Loader con el evento real de Pannellum
        viewer.on('load', function() {
            // Cuando la imagen realmente descarga, llenamos la barra al 100%
            progressBar.style.width = '100%';
            textElement.innerText = "¡Bienvenido a RED!";
            
            clearInterval(textInterval);

            // Desvanecer el loader suavemente
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 1000);
            }, 600);
            
            // Actualizar el título dinámico en el footer dependiendo de la escena
            actualizarTitulo();
        });

        // Actualizar el título inferior cada vez que el usuario cambia de escena
        viewer.on('scenechange', actualizarTitulo);

        function actualizarTitulo() {
            const currentScene = viewer.getScene();
            const sceneTitle = viewer.getConfig().scenes[currentScene].title;
            document.getElementById('scene-title').innerText = sceneTitle;
        }
    </script>
</body>
</html>
