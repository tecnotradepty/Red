<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RED Admin | Control de Barra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { redNeon: '#ff003c', darkBg: '#0a0a0a', cardBg: '#1a1a1a' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: white; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { border-bottom: 2px solid #ff003c; color: #ff003c; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header Admin -->
    <header class="bg-cardBg p-4 border-b border-gray-800 flex justify-between items-center z-50">
        <div>
            <h1 class="text-xl font-bold text-white tracking-widest"><span class="text-redNeon">RED</span> OPERACIONES</h1>
            <p class="text-xs text-gray-400">Terminal Principal - Barra</p>
        </div>
        <div class="flex items-center space-x-3">
            <span class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-xs font-bold flex items-center">
                <div class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></div> Online
            </span>
        </div>
    </header>

    <!-- Navegación -->
    <nav class="flex border-b border-gray-800 bg-cardBg">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="flex-1 py-3 text-sm font-bold tab-active">Pedidos (Mesas)</button>
        <button onclick="switchTab('pos')" id="tab-pos" class="flex-1 py-3 text-sm font-bold text-gray-500">POS (Hablado)</button>
        <button onclick="switchTab('feedback')" id="tab-feedback" class="flex-1 py-3 text-sm font-bold text-gray-500">Feedback Staff</button>
    </nav>

    <!-- ÁREA 1: KANBAN DE PEDIDOS (Conectado al index.html) -->
    <main id="view-pedidos" class="flex-grow overflow-y-auto p-4 space-y-4">
        <div class="flex justify-between items-end mb-2">
            <h2 class="font-bold text-gray-300"><i class="fas fa-satellite-dish text-redNeon mr-2"></i>Cola de Entrada</h2>
            <button onclick="cargarPedidos()" class="text-xs text-gray-400 bg-gray-800 px-2 py-1 rounded"><i class="fas fa-sync-alt"></i> Actualizar</button>
        </div>
        
        <div id="cola-pedidos" class="space-y-3">
            <!-- Pedidos renderizados por JS -->
            <p class="text-center text-gray-500 text-sm py-10" id="empty-state">No hay pedidos en cola.</p>
        </div>
    </main>

    <!-- ÁREA 2: POS MANUAL (Para pedidos hablados en barra) -->
    <main id="view-pos" class="hidden flex-grow overflow-y-auto p-4 flex flex-col">
        <h2 class="font-bold text-gray-300 mb-4"><i class="fas fa-cash-register text-redNeon mr-2"></i>Ingreso Manual</h2>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button class="bg-gray-800 p-4 rounded-lg font-bold text-left hover:bg-gray-700 transition" onclick="alert('Funcionalidad de prototipo')">Buchanans 12 <span class="block text-sm text-green-400">$120</span></button>
            <button class="bg-gray-800 p-4 rounded-lg font-bold text-left hover:bg-gray-700 transition" onclick="alert('Funcionalidad de prototipo')">Tito's Vodka <span class="block text-sm text-green-400">$80</span></button>
            <button class="bg-gray-800 p-4 rounded-lg font-bold text-left hover:bg-gray-700 transition" onclick="alert('Funcionalidad de prototipo')">Red Bull <span class="block text-sm text-green-400">$6</span></button>
            <button class="bg-gray-800 p-4 rounded-lg font-bold text-left hover:bg-gray-700 transition" onclick="alert('Funcionalidad de prototipo')">Agua <span class="block text-sm text-green-400">$3</span></button>
        </div>
        <button class="mt-auto w-full bg-redNeon text-white py-4 rounded-lg font-bold text-lg shadow-lg shadow-redNeon/30">
            Cobrar Rápido
        </button>
    </main>

    <!-- ÁREA 3: FEEDBACK Y REPORTE AL STAFF (Conectado a WhatsApp) -->
    <main id="view-feedback" class="hidden flex-grow overflow-y-auto p-4">
        <h2 class="font-bold text-gray-300 mb-6"><i class="fas fa-comment-dots text-redNeon mr-2"></i>Reporte Operativo</h2>
        
        <label class="block text-sm text-gray-400 mb-2">Estado del Turno</label>
        <div class="flex space-x-2 mb-6">
            <button onclick="setEstado('🟢 Fluido')" class="flex-1 bg-gray-800 border border-gray-700 py-3 rounded-lg text-xl hover:bg-gray-700">🟢</button>
            <button onclick="setEstado('🟡 Denso')" class="flex-1 bg-gray-800 border border-gray-700 py-3 rounded-lg text-xl hover:bg-gray-700">🟡</button>
            <button onclick="setEstado('🔴 Caos')" class="flex-1 bg-gray-800 border border-gray-700 py-3 rounded-lg text-xl hover:bg-gray-700">🔴</button>
        </div>

        <label class="block text-sm text-gray-400 mb-2">Fricción Principal (Opcional)</label>
        <select id="friccion" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 mb-6 appearance-none">
            <option value="Ninguna">Todo perfecto</option>
            <option value="Falta de stock">Falta de stock en barra</option>
            <option value="Mucho pedido manual">Mucho pedido manual (clientes no usan QR)</option>
            <option value="Lentitud de red">Lentitud de red / Internet</option>
        </select>

        <label class="block text-sm text-gray-400 mb-2">Comentarios Adicionales</label>
        <textarea id="comentarios" rows="3" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 mb-6 placeholder-gray-500" placeholder="Ej. Necesitamos más hielo rápido..."></textarea>

        <!-- Botón que envía a WhatsApp -->
        <button onclick="enviarReporte()" class="w-full bg-[#25D366] text-white py-4 rounded-lg font-bold shadow-lg shadow-green-900/50 flex justify-center items-center">
            <i class="fab fa-whatsapp text-xl mr-2"></i> Enviar Reporte
        </button>
    </main>

    <script>
        // Lógica de Pestañas
        function switchTab(tabId) {
            ['pedidos', 'pos', 'feedback'].forEach(id => {
                document.getElementById(`view-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('tab-active', 'text-redNeon');
                document.getElementById(`tab-${id}`).classList.add('text-gray-500');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('text-gray-500');
            document.getElementById(`tab-${tabId}`).classList.add('tab-active', 'text-redNeon');
        }

        // Lógica KANBAN (Leer pedidos del Cliente)
        function cargarPedidos() {
            const cola = document.getElementById('cola-pedidos');
            const emptyState = document.getElementById('empty-state');
            
            // Leer desde localStorage (Simulación de Base de Datos en Tiempo Real)
            let pedidos = JSON.parse(localStorage.getItem('red_pedidos')) || [];
            
            if (pedidos.length === 0) {
                emptyState.style.display = 'block';
                cola.innerHTML = '';
                cola.appendChild(emptyState);
                return;
            }

            emptyState.style.display = 'none';
            cola.innerHTML = ''; // Limpiar cola

            pedidos.reverse().forEach((pedido, index) => {
                let itemsHTML = '';
                pedido.items.forEach(item => {
                    itemsHTML += `<div class="flex justify-between text-sm text-gray-300"><span class="font-bold">${item.cant}x</span> <span>${item.nombre}</span></div>`;
                });

                cola.innerHTML += `
                    <div class="bg-cardBg border border-gray-700 rounded-xl p-4 shadow-md relative overflow-hidden" id="card-${index}">
                        <div class="absolute top-0 left-0 w-1 h-full bg-redNeon"></div>
                        <div class="flex justify-between items-start border-b border-gray-800 pb-2 mb-2">
                            <div>
                                <h3 class="font-bold text-white text-lg">Mesa ${pedido.mesa}</h3>
                                <p class="text-xs text-gray-500">ID: ${pedido.id} • ${pedido.timestamp}</p>
                            </div>
                            <div class="text-right">
                                <span class="bg-redNeon/20 text-redNeon px-2 py-1 rounded text-xs font-bold border border-redNeon/30">${pedido.tipo}</span>
                            </div>
                        </div>
                        <div class="mb-4 space-y-1">
                            ${itemsHTML}
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-green-400 font-bold">$${pedido.total}</span>
                            <button onclick="marcarEntregado(${index})" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">
                                Despachar <i class="fas fa-check ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function marcarEntregado(index) {
            let pedidos = JSON.parse(localStorage.getItem('red_pedidos')) || [];
            // Para el prototipo, simplemente lo removemos de la cola
            pedidos.splice(pedidos.length - 1 - index, 1); 
            localStorage.setItem('red_pedidos', JSON.stringify(pedidos));
            document.getElementById(`card-${index}`).style.opacity = '0.5';
            setTimeout(cargarPedidos, 300);
        }

        // Escuchar cambios en el almacenamiento local para actualizar en vivo
        window.addEventListener('storage', function(e) {
            if(e.key === 'red_pedidos') {
                cargarPedidos();
            }
        });

        // Carga inicial
        cargarPedidos();

        // Lógica del Feedback a WhatsApp
        let estadoTurno = "Sin definir";

        function setEstado(estado) {
            estadoTurno = estado;
            alert("Estado seleccionado: " + estado);
        }

        function enviarReporte() {
            if(estadoTurno === "Sin definir") return alert("Por favor, selecciona el estado del turno (Caritas)");

            const friccion = document.getElementById('friccion').value;
            const comentarios = document.getElementById('comentarios').value;
            
            // Reemplaza con tu número o el de prueba
            const telefonoDestino = "50760000000"; 
            
            const mensaje = `🚨 *REPORTE OPERATIVO RED*\n\n*Estado:* ${estadoTurno}\n*Fricción:* ${friccion}\n*Comentarios:* ${comentarios ? comentarios : 'N/A'}`;
            
            const url = `https://wa.me/${telefonoDestino}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
