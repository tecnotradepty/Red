<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RED Admin | Terminal Operativa</title>
    
    <!-- Tailwind CSS y FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fuentes Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* SISTEMA DE DISEÑO ADMIN (RED IDENTIDAD)    */
        /* ========================================== */
        :root {
            --bg-primary: #030001;
            --neon-red: #ff003c;
            --gold-primary: #d4af37;
            
            --text-pure: #ffffff;
            --text-muted: #8e8e93;
            
            --glass-bg: rgba(15, 15, 18, 0.85);
            --glass-border: rgba(255, 0, 60, 0.2);
            
            --font-headings: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body { background-color: var(--bg-primary); color: var(--text-pure); font-family: var(--font-body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade { animation: fadeIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Componentes Admin */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }
        .card-order {
            background: rgba(10, 10, 12, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-left: 4px solid var(--neon-red);
            border-radius: 8px; transition: all 0.3s ease;
        }
        .card-order:hover { box-shadow: 0 5px 20px rgba(255, 0, 60, 0.15); border-color: rgba(255, 0, 60, 0.3); }

        .title-admin { font-family: var(--font-headings); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        
        .tab-btn { font-family: var(--font-headings); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); transition: all 0.3s ease; }
        .tab-active { color: var(--neon-red); border-bottom: 2px solid var(--neon-red); }

        .btn-action {
            background: var(--neon-red); color: white; font-family: var(--font-headings); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
            border-radius: 4px; transition: all 0.3s ease;
        }
        .btn-action:hover { box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }

        .logo-blend { mix-blend-mode: screen; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- HEADER OPERATIVO -->
    <header class="glass-panel p-4 flex justify-between items-center z-50 sticky top-0">
        <div class="flex items-center space-x-4">
            <img src="https://raw.githubusercontent.com/tecnotradepty/Red/f5371dd291d84d225ca9de079ac75e584d78fdd7/imagenes/redicon.jpg" alt="RED Logo" class="h-6 logo-blend">
            <div class="border-l border-white/20 pl-4">
                <h1 class="title-admin text-sm text-white">Terminal Operativa</h1>
                <p class="text-[9px] text-gray-400 uppercase tracking-widest font-body">Estación: Barra Principal</p>
            </div>
        </div>
        <div class="flex items-center">
            <span class="bg-green-500/10 border border-green-500/30 text-green-400 px-3 py-1.5 rounded text-[10px] font-bold font-headings uppercase tracking-widest flex items-center shadow-[0_0_10px_rgba(34,197,94,0.2)]">
                <div class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></div> En Línea
            </span>
        </div>
    </header>

    <!-- NAVEGACIÓN DE TABS -->
    <nav class="flex border-b border-white/10 bg-[#0a0a0a]">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="flex-1 py-4 text-xs tab-btn tab-active">
            <i class="fas fa-satellite-dish mr-2"></i> Monitor VIP
        </button>
        <button onclick="switchTab('pos')" id="tab-pos" class="flex-1 py-4 text-xs tab-btn">
            <i class="fas fa-cash-register mr-2"></i> POS Rápido
        </button>
        <button onclick="switchTab('feedback')" id="tab-feedback" class="flex-1 py-4 text-xs tab-btn">
            <i class="fas fa-headset mr-2"></i> Staff Report
        </button>
    </nav>

    <!-- ========================================== -->
    <!-- ÁREA 1: KANBAN MONITOR (Conectado a App)   -->
    <!-- ========================================== -->
    <main id="view-pedidos" class="flex-grow overflow-y-auto p-4 space-y-4 bg-gradient-to-b from-[#050505] to-[#0a0a0a]">
        <div class="flex justify-between items-end mb-4 border-b border-white/5 pb-2">
            <h2 class="title-admin text-sm text-gray-300">Cola de Comandas</h2>
            <button onclick="cargarPedidos()" class="text-[10px] text-gray-400 border border-white/10 bg-black/50 px-3 py-1.5 rounded hover:text-white transition uppercase font-headings font-bold tracking-widest">
                <i class="fas fa-sync-alt mr-1"></i> Actualizar
            </button>
        </div>
        
        <div id="cola-pedidos" class="space-y-4">
            <!-- Renders via JS -->
            <div id="empty-state" class="text-center py-20 opacity-50">
                <i class="fas fa-check-double text-4xl mb-3 text-gray-600"></i>
                <p class="font-headings font-bold text-sm uppercase tracking-widest text-gray-500">Barra despejada</p>
                <p class="text-[10px] font-body text-gray-600 mt-1">Esperando nuevas comandas...</p>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- ÁREA 2: POS MANUAL (Punto de Venta)        -->
    <!-- ========================================== -->
    <main id="view-pos" class="hidden flex-grow overflow-y-auto p-4 flex flex-col bg-[#050505]">
        <h2 class="title-admin text-sm text-gray-300 mb-4 border-b border-white/5 pb-2">Ingreso Manual (Walk-ins)</h2>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button class="glass-panel p-4 rounded-xl text-left hover:bg-white/5 transition group" onclick="alert('Funcionalidad POS: Añadido al ticket')">
                <h3 class="font-headings font-bold text-sm uppercase text-white group-hover:text-redNeon transition">Buchanans 12</h3>
                <span class="block text-xs font-bold text-green-400 mt-1">$120.00</span>
            </button>
            <button class="glass-panel p-4 rounded-xl text-left hover:bg-white/5 transition group" onclick="alert('Funcionalidad POS: Añadido al ticket')">
                <h3 class="font-headings font-bold text-sm uppercase text-white group-hover:text-redNeon transition">Tito's Vodka</h3>
                <span class="block text-xs font-bold text-green-400 mt-1">$80.00</span>
            </button>
            <button class="glass-panel p-4 rounded-xl text-left hover:bg-white/5 transition group" onclick="alert('Funcionalidad POS: Añadido al ticket')">
                <h3 class="font-headings font-bold text-sm uppercase text-white group-hover:text-redNeon transition">Red Bull</h3>
                <span class="block text-xs font-bold text-green-400 mt-1">$6.00</span>
            </button>
            <button class="glass-panel p-4 rounded-xl text-left hover:bg-white/5 transition group" onclick="alert('Funcionalidad POS: Añadido al ticket')">
                <h3 class="font-headings font-bold text-sm uppercase text-white group-hover:text-redNeon transition">Agua Embotellada</h3>
                <span class="block text-xs font-bold text-green-400 mt-1">$3.00</span>
            </button>
        </div>

        <div class="mt-auto border-t border-white/10 pt-4">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-xs text-gray-400 uppercase font-headings tracking-widest">Total Mesa</span>
                <span class="text-2xl font-headings font-black text-white">$0.00</span>
            </div>
            <button class="btn-action w-full py-4 text-sm shadow-[0_0_20px_rgba(255,0,60,0.3)]">
                Procesar Cobro
            </button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- ÁREA 3: FEEDBACK STAFF (WhatsApp Bridge)   -->
    <!-- ========================================== -->
    <main id="view-feedback" class="hidden flex-grow overflow-y-auto p-4 bg-[#050505]">
        <h2 class="title-admin text-sm text-gray-300 mb-6 border-b border-white/5 pb-2">Reporte Operativo de Turno</h2>
        
        <div class="glass-panel p-5 rounded-xl mb-6 border-white/10">
            <label class="block text-[10px] font-headings text-gray-400 uppercase tracking-widest mb-3">Pulso de la Barra</label>
            <div class="flex space-x-2">
                <button onclick="setEstado('🟢 Fluido')" class="flex-1 bg-black/50 border border-white/5 py-4 rounded-lg text-2xl hover:border-green-500 hover:bg-green-500/10 transition">🟢</button>
                <button onclick="setEstado('🟡 Denso')" class="flex-1 bg-black/50 border border-white/5 py-4 rounded-lg text-2xl hover:border-yellow-500 hover:bg-yellow-500/10 transition">🟡</button>
                <button onclick="setEstado('🔴 Caos')" class="flex-1 bg-black/50 border border-white/5 py-4 rounded-lg text-2xl hover:border-red-500 hover:bg-red-500/10 transition">🔴</button>
            </div>
        </div>

        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-[10px] font-headings text-gray-400 uppercase tracking-widest mb-2">Fricción Detectada</label>
                <select id="friccion" class="w-full bg-black/50 border border-white/10 text-white font-body text-sm rounded-lg p-4 appearance-none outline-none focus:border-redNeon transition">
                    <option value="Operación Normal">Todo en orden</option>
                    <option value="Quiebre de Stock">Falta de stock (Hielo/Mixers)</option>
                    <option value="Fricción QR">Clientes no entienden QR</option>
                    <option value="Caída Red">Intermitencia de WiFi/POS</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-headings text-gray-400 uppercase tracking-widest mb-2">Notas Adicionales</label>
                <textarea id="comentarios" rows="3" class="w-full bg-black/50 border border-white/10 text-white font-body text-sm rounded-lg p-4 outline-none focus:border-redNeon transition placeholder-gray-600" placeholder="Ej. Necesitamos runner en zona Platinum..."></textarea>
            </div>
        </div>

        <button onclick="enviarReporte()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-headings font-black uppercase tracking-widest shadow-[0_0_20px_rgba(37,211,102,0.3)] hover:bg-[#20b858] transition flex justify-center items-center">
            <i class="fab fa-whatsapp text-lg mr-2"></i> Enviar a Gerencia
        </button>
    </main>

    <script>
        // --- NAVEGACIÓN ---
        function switchTab(tabId) {
            ['pedidos', 'pos', 'feedback'].forEach(id => {
                document.getElementById(`view-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('tab-active');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`view-${tabId}`).classList.add('animate-fade');
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
        }

        // --- LÓGICA KANBAN (Monitor VIP) ---
        function cargarPedidos() {
            const cola = document.getElementById('cola-pedidos');
            const emptyState = document.getElementById('empty-state');
            
            // Leer desde localStorage (El puente con el cliente)
            let pedidos = JSON.parse(localStorage.getItem('red_pedidos')) || [];
            
            if (pedidos.length === 0) {
                emptyState.style.display = 'block';
                // Removemos todas las tarjetas excepto el empty state
                Array.from(cola.children).forEach(child => { if(child.id !== 'empty-state') child.remove(); });
                return;
            }

            emptyState.style.display = 'none';
            cola.innerHTML = ''; // Limpiar cola para re-renderizar
            cola.appendChild(emptyState); // Mantener el div oculto

            pedidos.reverse().forEach((pedido, index) => {
                let itemsHTML = '';
                pedido.items.forEach(item => {
                    itemsHTML += `
                    <div class="flex justify-between text-xs font-body text-gray-300 py-1 border-b border-white/5 last:border-0">
                        <span><span class="font-bold text-white">${item.cant}x</span> ${item.nombre}</span>
                    </div>`;
                });

                // Detectar tipo para estilo visual (Barra vs Mesa)
                const isQR = pedido.tipo.includes("QR");
                const badgeColor = isQR ? "text-cyan-400 border-cyan-400/30 bg-cyan-400/10" : "text-yellow-500 border-yellow-500/30 bg-yellow-500/10";
                const icon = isQR ? "fa-walking" : "fa-couch";
                const targetText = isQR ? "Retiro en Barra" : pedido.mesa;

                const cardHTML = `
                    <div class="card-order p-4 animate-fade" id="card-${index}">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-headings font-black text-white uppercase text-sm">${targetText}</h3>
                                <p class="text-[9px] text-gray-500 font-body">Ref: ${pedido.id} • ${pedido.time || 'N/A'}</p>
                            </div>
                            <span class="px-2 py-1 border rounded-[4px] text-[8px] font-headings font-bold uppercase tracking-widest flex items-center ${badgeColor}">
                                <i class="fas ${icon} mr-1"></i> ${isQR ? 'Fast Pass' : 'VIP Service'}
                            </span>
                        </div>
                        
                        <div class="bg-black/40 rounded p-3 mb-4 border border-white/5">
                            ${itemsHTML}
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[8px] font-headings text-gray-500 uppercase tracking-widest">Total Comanda</p>
                                <span class="text-green-400 font-headings font-black">$${parseFloat(pedido.total).toFixed(2)}</span>
                            </div>
                            <button onclick="marcarEntregado(${index})" class="bg-white hover:bg-gray-200 text-black px-4 py-2 rounded-[4px] text-[10px] font-headings font-black uppercase tracking-widest transition flex items-center shadow-lg">
                                Despachar <i class="fas fa-check-circle ml-2"></i>
                            </button>
                        </div>
                    </div>
                `;
                cola.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function marcarEntregado(index) {
            let pedidos = JSON.parse(localStorage.getItem('red_pedidos')) || [];
            // Removemos el pedido simulando despacho
            pedidos.splice(pedidos.length - 1 - index, 1); 
            localStorage.setItem('red_pedidos', JSON.stringify(pedidos));
            
            const card = document.getElementById(`card-${index}`);
            card.style.transform = 'translateX(100%)';
            card.style.opacity = '0';
            setTimeout(cargarPedidos, 300);
        }

        // Listener en tiempo real para cuando el cliente paga en el index.html
        window.addEventListener('storage', function(e) {
            if(e.key === 'red_pedidos') {
                cargarPedidos();
                // Opcional: Sonido de notificación de nueva orden
            }
        });

        // Inicialización
        cargarPedidos();

        // --- LÓGICA FEEDBACK WHATSAPP ---
        let estadoTurno = "";

        function setEstado(estado) {
            estadoTurno = estado;
            // Feedback visual rápido
            const btn = event.currentTarget;
            const parent = btn.parentElement;
            Array.from(parent.children).forEach(c => c.classList.remove('border-white', 'opacity-100'));
            Array.from(parent.children).forEach(c => c.classList.add('opacity-50'));
            btn.classList.add('border-white', 'opacity-100');
            btn.classList.remove('opacity-50');
        }

        function enviarReporte() {
            if(!estadoTurno) return alert("Selecciona el 'Pulso de la Barra' antes de reportar.");

            const friccion = document.getElementById('friccion').value;
            const comentarios = document.getElementById('comentarios').value;
            
            // Reemplaza con el número de la gerencia de RED
            const telefonoDestino = "50760000000"; 
            
            const mensaje = `🚨 *REPORTE OPERATIVO RED*\n\n*Terminal:* Barra Principal\n*Estado:* ${estadoTurno}\n*Fricción:* ${friccion}\n*Notas:* ${comentarios ? comentarios : 'N/A'}`;
            
            const url = `https://wa.me/${telefonoDestino}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
